<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>米娜游戏铺 · 中文小游戏合集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --rice: #F6EEDC;
    --rice-deep: #EFE3C6;
    --lacquer: #C0432E;
    --lacquer-deep: #93261C;
    --leaf-solid: #3E8259;
    --leaf-deep: #285C3B;
    --citrus: #E8A23A;
    --ink: #2B211B;
    --ink-soft: #6b5c4c;
    --basket: #D8C598;
    --basket-line: #B49E68;
    --card-shadow: 0 18px 40px -14px rgba(43,33,27,0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--rice);
    color: var(--ink);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 100vw;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  body {
    background-image:
      radial-gradient(circle at 8% 10%, rgba(192,67,46,0.06) 0, transparent 40%),
      radial-gradient(circle at 92% 88%, rgba(62,130,89,0.09) 0, transparent 45%);
  }
  .stage { max-width: 960px; margin: 0 auto; padding: 30px 20px 60px; }

  header { text-align: center; margin-bottom: 26px; }
  header h1 {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 40px; color: var(--lacquer); margin: 0 0 4px; letter-spacing: 2px;
  }
  header p { margin: 0; color: var(--ink-soft); font-weight: 700; font-size: 14px; }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .game-card {
    background: linear-gradient(180deg, #fffaf0, var(--rice-deep));
    border-radius: 22px;
    padding: 22px 18px;
    text-align: center;
    cursor: pointer;
    box-shadow: var(--card-shadow), inset 0 0 0 2px rgba(180,158,104,0.35);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    border: none;
    font-family: inherit;
  }
  .game-card:hover { transform: translateY(-4px); }
  .game-card:active { transform: translateY(-1px); }
  .game-card .emoji { font-size: 46px; margin-bottom: 8px; }
  .game-card h2 {
    font-size: 17px; margin: 0 0 4px; color: var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .game-card .zh { font-weight: 800; }
  .game-card .en { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
  .game-card p.desc {
    font-size: 12.5px; color: var(--ink-soft); font-weight: 600;
    line-height: 1.5; margin: 6px 0 10px;
  }
  .game-card .play-pill {
    display: inline-block; background: var(--leaf-solid); color: #fff;
    font-size: 12px; font-weight: 800; padding: 5px 14px; border-radius: 999px;
  }

  .game-card.coming-soon {
    cursor: default; opacity: 0.55;
  }
  .game-card.coming-soon:hover { transform: none; }
  .game-card.coming-soon .play-pill { background: var(--basket-line); }

  /* ---- Modal ---- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(30,22,16,0.62);
    display: none;
    align-items: center; justify-content: center;
    padding: clamp(4px, 1.5vw, 20px);
    padding-top: calc(clamp(4px, 1.5vw, 20px) + env(safe-area-inset-top));
    padding-right: calc(clamp(4px, 1.5vw, 20px) + env(safe-area-inset-right));
    padding-bottom: calc(clamp(4px, 1.5vw, 20px) + env(safe-area-inset-bottom));
    padding-left: calc(clamp(4px, 1.5vw, 20px) + env(safe-area-inset-left));
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    position: relative;
    width: 100%; height: 100%;
    max-width: 1600px; max-height: 98vh; max-height: 98dvh;
    background: var(--rice);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 80px -18px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08);
    animation: modalPop 0.2s ease;
  }
  @keyframes modalPop { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
  .modal-box iframe {
    width: 100%; height: 100%; border: none; display: block; background: #fff;
  }
  .modal-close {
    position: absolute; top: 12px; right: 12px; z-index: 10;
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: rgba(20,14,10,0.7); color: #fff;
    font-size: 20px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
  }
  .modal-close:hover { background: rgba(20,14,10,0.9); }
  .modal-title-pill {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(20,14,10,0.7); color: #fff;
    font-size: 12.5px; font-weight: 800; padding: 7px 14px; border-radius: 999px;
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>米娜游戏铺</h1>
    <p>Mina's Game Shop · 点一个游戏开始玩,想退出随时点右上角关闭</p>
  </header>

  <div class="game-grid" id="gameGrid"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title-pill" id="modalTitle"></div>
    <button class="modal-close" id="modalCloseBtn" type="button" aria-label="关闭">✕</button>
    <iframe id="gameFrame" src="about:blank" title="game"></iframe>
  </div>
</div>

  const GAMES = [
    {
      id: 'mina-market',
      emojiIcon: '🏪',
      zh: '米娜集市',
      en: 'Mina Market',
      desc: '当摊位老板,凑汉字接订单;闯关解锁地图新摊位,赚金币装扮你的小老板',
      inline: true   // 游戏代码直接内嵌在本文件里,不依赖任何外部网址
    },
    {
      id: 'coming-soon-1',
      emojiIcon: '❓',
      zh: '敬请期待',
      en: 'Coming Soon',
      desc: '更多小游戏正在制作中',
      url: null
    }
  ];

  const gameGrid = document.getElementById('gameGrid');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  const modalTitle = document.getElementById('modalTitle');
  const gameFrame = document.getElementById('gameFrame');

  function renderGrid(){
    gameGrid.innerHTML = '';
    GAMES.forEach(game => {
      const isPlayable = !!(game.url || game.inline);
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'game-card' + (isPlayable ? '' : ' coming-soon');
      card.innerHTML = `
        <div class="emoji">${game.emojiIcon}</div>
        <h2><span class="zh">${game.zh}</span></h2>
        <div class="en">${game.en}</div>
        <p class="desc">${game.desc}</p>
        <span class="play-pill">${isPlayable ? '▶ 开始玩 Play' : '即将上线'}</span>
      `;
      if (isPlayable){
        card.addEventListener('click', () => openGame(game));
      }
      gameGrid.appendChild(card);
    });
  }

  function decodeGameHtml(b64){
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  function openGame(game){
    modalTitle.textContent = game.zh + ' · ' + game.en;
    if (game.inline){
      gameFrame.removeAttribute('src');
      gameFrame.srcdoc = decodeGameHtml(GAME_HTML_B64);
    } else {
      gameFrame.src = game.url;
    }
    modalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    modalOverlay.classList.remove('open');
    gameFrame.removeAttribute('srcdoc');
    gameFrame.src = 'about:blank'; // 卸载游戏,停止其中的语音/计时器等
    document.body.style.overflow = '';
  }

  modalCloseBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal(); // 点击背景也可以关闭
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
  });

  renderGrid();
})();
</script>
